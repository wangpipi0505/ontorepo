server.port=18182
spring.datasource.url=${ONTO_DB_URL}
spring.datasource.username=${ONTO_DB_USER}
spring.datasource.password=${ONTO_DB_PASSWORD}
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=never
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB

# 禁止浮点修订截断和字符串布尔/数字隐式转换，业务校验必须看到真实请求类型。
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false

# 外部源驱动由空间加密配置按需创建；禁止因类路径存在驱动而自动连接默认localhost源。
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.neo4j.Neo4jAutoConfiguration,org.springframework.boot.autoconfigure.cassandra.CassandraAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
